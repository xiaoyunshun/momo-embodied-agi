# 墨墨开源框架 — GitHub Actions CI/CD

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Python 语法检查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 语法检查
        run: |
          FAILED=0
          while IFS= read -r f; do
            if python3 -c "import ast; ast.parse(open('$f').read())" 2>/dev/null; then
              echo "  OK  $f"
            else
              echo "  FAIL  $f"
              FAILED=1
            fi
          done < <(find . -name '*.py' -not -path './.git/*')
          exit $FAILED

  package:
    name: 包导入 + 基本运行
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装和测试
        run: |
          pip install .
          python3 << 'EOF'
          from momo import __version__, NAME, MomoRunner
          print(f"导入成功: {NAME} v{__version__}")
          runner = MomoRunner(xiaoge_name="CI")
          result = runner.start()
          print(f"启动: {result['status']}")
          resp = runner.interact("hello 墨墨")
          print(f"交互: {resp['response']}")
          runner.stop()
          print("✅ CI 测试全部通过")
          EOF

  examples:
    name: 示例运行测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装并运行示例
        run: |
          pip install .
          for ex in examples/01_quickstart.py examples/02_custom_avatar.py examples/03_custom_sense.py; do
            echo "=== 运行 $ex ==="
            python3 "$ex" || exit 1
            echo ""
          done
          echo "✅ 所有示例运行通过"
